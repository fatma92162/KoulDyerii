# config/services.yaml

parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    # ✅ Définition de votre extension Twig pour la censure
    App\Twig\CensorshipExtension:
        tags: ['twig.extension']

    # ✅ Service pour les tentatives de connexion (blocage après 3 échecs)
    App\Security\LoginAttemptService:
        arguments:
            $cache: '@cache.app'

    # ✅ Écouteur d'échec de connexion
    App\Security\LoginFailureListener:
        tags:
            - { name: kernel.event_subscriber }

    # ✅ Vérificateur d'utilisateur (bloque l'authentification si trop d'échecs)
    App\Security\LoginBlockedChecker:
        tags:
            - { name: security.user_checker }

    # ✅ Écouteur de succès de connexion (réinitialise le compteur)
    App\Security\LoginSuccessListener:
        tags:
            - { name: kernel.event_subscriber }