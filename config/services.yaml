# config/services.yaml

parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    # ✅ Définition de votre extension Twig pour la censure
    App\Twig\CensorshipExtension:
        tags: ['twig.extension']

    # ✅ Définition de l'écouteur de locale pour la traduction
    App\EventListener\LocaleListener:
        tags:
            - { name: kernel.event_listener, event: kernel.request, priority: 20 }

    # ✅ Définition du service de notifications
    App\Service\NotificationService:
        autowire: true
        autoconfigure: true

    # ✅ Définition de l'extension Twig pour les messages
    App\Twig\MessageExtension:
        tags: ['twig.extension']

    # ✅ Définition du service AI Assistant (Google Gemini)
    App\Service\AIAssistant:
        arguments:
            $apiKey: '%env(GEMINI_API_KEY)%'

    # ✅ Définition du service AiReplyService
    App\Service\AiReplyService:
        arguments:
            $gemini: '@gemini'  # ou '@Gemini\Gemini' selon votre bundle